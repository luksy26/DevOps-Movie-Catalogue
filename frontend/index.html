<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Catalogue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .db-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #f0f0f0;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.connected {
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
            width: auto;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .link-btn {
            background: none;
            color: #667eea;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 15px;
            display: block;
            text-align: center;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3c3;
        }

        .movie-list {
            margin-top: 20px;
        }

        .movie-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateX(5px);
        }

        .movie-info h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .movie-info p {
            color: #666;
            font-size: 0.9em;
        }

        .movie-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .delete-confirm {
            display: flex;
            gap: 8px;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .delete-confirm .btn {
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .user-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-movie-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .tab-btn:hover {
            border-color: #667eea;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .add-tab {
            animation: fadeIn 0.3s;
        }

        .catalogue-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .catalogue-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .catalogue-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .catalogue-item-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .catalogue-item-info p {
            color: #666;
            font-size: 0.9em;
        }

        .btn-add-from-catalogue {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: transform 0.2s;
        }

        .btn-add-from-catalogue:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Movie Catalogue</h1>
            <div class="db-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Checking database...</span>
            </div>
        </div>

        <!-- Login View -->
        <div id="loginView" class="view active">
            <div id="loginError" class="error-message hidden"></div>
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <button class="link-btn" onclick="showRegister()">Don't have an account? Register</button>
        </div>

        <!-- Register View -->
        <div id="registerView" class="view">
            <div id="registerError" class="error-message hidden"></div>
            <div id="registerSuccess" class="success-message hidden"></div>
            <div class="form-group">
                <label for="registerUsername">Username</label>
                <input type="text" id="registerUsername" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Choose a password">
            </div>
            <button class="btn" onclick="register()">Register</button>
            <button class="link-btn" onclick="showLogin()">Already have an account? Login</button>
        </div>

        <!-- Movies View -->
        <div id="moviesView" class="view">
            <div class="user-info">
                <span>Welcome, <strong id="currentUser"></strong>!</span>
                <button class="btn btn-secondary" style="width: auto; padding: 8px 16px;" onclick="logout()">Logout</button>
            </div>

            <div class="add-movie-form">
                <h3 style="margin-bottom: 15px;">Add New Movie</h3>
                <div id="addMovieError" class="error-message hidden"></div>
                <div id="addMovieSuccess" class="success-message hidden"></div>
                
                <!-- Tab buttons -->
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="tab-btn active" onclick="showAddTab('browse')" id="browseTab">
                        📚 Browse Catalogue
                    </button>
                    <button class="tab-btn" onclick="showAddTab('manual')" id="manualTab">
                        ✍️ Manual Entry
                    </button>
                </div>

                <!-- Browse Catalogue Tab -->
                <div id="browseCatalogueTab" class="add-tab active">
                    <div id="catalogueLoading" class="loading hidden">Loading catalogue...</div>
                    <div id="catalogueEmpty" class="hidden" style="text-align: center; padding: 20px; color: #666;">
                        No movies in catalogue yet. Use manual entry to add your own!
                    </div>
                    <div id="catalogueList" class="catalogue-list"></div>
                </div>

                <!-- Manual Entry Tab -->
                <div id="manualEntryTab" class="add-tab" style="display: none;">
                    <div class="form-row">
                        <div class="form-group" style="margin: 0;">
                            <input type="text" id="movieName" placeholder="Movie name">
                        </div>
                        <div class="form-group" style="margin: 0;">
                            <input type="text" id="movieGenre" placeholder="Genre">
                        </div>
                        <div class="form-group" style="margin: 0;">
                            <input type="number" id="movieYear" placeholder="Year">
                        </div>
                    </div>
                    <button class="btn" onclick="addMovie()">Add Movie</button>
                </div>
            </div>

            <h3 style="margin-bottom: 15px;">Your Movies</h3>
            <div id="loadingMovies" class="loading hidden">Loading movies...</div>
            <div id="moviesList" class="movie-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:30000/api';
        let authToken = null;
        let currentUsername = null;

        // Load auth state from localStorage
        function loadAuthState() {
            const savedToken = localStorage.getItem('authToken');
            const savedUsername = localStorage.getItem('currentUsername');
            const savedView = localStorage.getItem('currentView');
            
            if (savedToken && savedUsername) {
                authToken = savedToken;
                currentUsername = savedUsername;
                showMovies();
            } else if (savedView === 'register') {
                showRegister();
            }
        }

        // Save auth state to localStorage
        function saveAuthState() {
            localStorage.setItem('authToken', authToken);
            localStorage.setItem('currentUsername', currentUsername);
        }

        // Clear auth state from localStorage
        function clearAuthState() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUsername');
            localStorage.removeItem('currentView');
        }

        // Check database status on load
        async function checkDatabaseStatus() {
            try {
                const response = await fetch(`${API_BASE}/testauth`);
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('statusDot').classList.add('connected');
                    document.getElementById('statusText').textContent = 'Database connected';
                }
            } catch (error) {
                document.getElementById('statusText').textContent = 'Database disconnected';
            }
        }

        // Show different views
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function showLogin() {
            showView('loginView');
            clearMessages();
            localStorage.setItem('currentView', 'login');
        }

        function showRegister() {
            showView('registerView');
            clearMessages();
            localStorage.setItem('currentView', 'register');
        }

        function showMovies() {
            showView('moviesView');
            document.getElementById('currentUser').textContent = currentUsername;
            localStorage.setItem('currentView', 'movies');
            loadMovies();
            loadCatalogue();
        }

        // Switch between add movie tabs
        function showAddTab(tab) {
            const browseTab = document.getElementById('browseCatalogueTab');
            const manualTab = document.getElementById('manualEntryTab');
            const browseBtn = document.getElementById('browseTab');
            const manualBtn = document.getElementById('manualTab');

            if (tab === 'browse') {
                browseTab.style.display = 'block';
                manualTab.style.display = 'none';
                browseBtn.classList.add('active');
                manualBtn.classList.remove('active');
                loadCatalogue();
            } else {
                browseTab.style.display = 'none';
                manualTab.style.display = 'block';
                browseBtn.classList.remove('active');
                manualBtn.classList.add('active');
            }
        }

        function clearMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(el => {
                el.classList.add('hidden');
            });
        }

        // Register
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const errorEl = document.getElementById('registerError');
            const successEl = document.getElementById('registerSuccess');

            clearMessages();

            if (!username || !password) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successEl.textContent = `Account created successfully! You can now login.`;
                    successEl.classList.remove('hidden');
                    document.getElementById('registerUsername').value = '';
                    document.getElementById('registerPassword').value = '';
                } else {
                    errorEl.textContent = data.error || 'Registration failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        }

        // Login
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            clearMessages();

            if (!username || !password) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    currentUsername = username;
                    saveAuthState();
                    showMovies();
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        }

        // Logout
        function logout() {
            authToken = null;
            currentUsername = null;
            clearAuthState();
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            showLogin();
        }

        // Load movies
        async function loadMovies() {
            const moviesListEl = document.getElementById('moviesList');
            const loadingEl = document.getElementById('loadingMovies');

            loadingEl.classList.remove('hidden');
            moviesListEl.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/movies`, {
                    headers: { 'Authorization': authToken }
                });

                const data = await response.json();
                loadingEl.classList.add('hidden');

                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }

                if (data.movies && data.movies.length > 0) {
                    moviesListEl.innerHTML = data.movies.map((movie, index) => `
                        <div class="movie-card" id="movie-${index}">
                            <div class="movie-info">
                                <h3>${movie.name}</h3>
                                <p><strong>Genre:</strong> ${movie.genre} | <strong>Year:</strong> ${movie.year}</p>
                            </div>
                            <div class="movie-actions">
                                <button class="btn btn-danger delete-btn" onclick="showDeleteConfirm(${index}, '${movie.name}', ${movie.year})">Delete</button>
                                <div class="delete-confirm hidden" id="confirm-${index}">
                                    <button class="btn btn-danger" onclick="confirmDelete('${movie.name}', ${movie.year})">✓ Confirm</button>
                                    <button class="btn" onclick="cancelDelete(${index})">✗ Cancel</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    moviesListEl.innerHTML = '<p style="text-align: center; color: #666;">No movies yet. Add your first movie!</p>';
                }
            } catch (error) {
                loadingEl.classList.add('hidden');
                moviesListEl.innerHTML = '<p style="text-align: center; color: #c33;">Error loading movies</p>';
            }
        }

        // Load catalogue
        async function loadCatalogue() {
            const catalogueListEl = document.getElementById('catalogueList');
            const loadingEl = document.getElementById('catalogueLoading');
            const emptyEl = document.getElementById('catalogueEmpty');

            loadingEl.classList.remove('hidden');
            catalogueListEl.innerHTML = '';
            emptyEl.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/all-movies`);
                const data = await response.json();
                loadingEl.classList.add('hidden');

                if (data.movies && data.movies.length > 0) {
                    catalogueListEl.innerHTML = data.movies.map(movie => `
                        <div class="catalogue-item">
                            <div class="catalogue-item-info">
                                <h4>${movie.name}</h4>
                                <p><strong>Genre:</strong> ${movie.genre} | <strong>Year:</strong> ${movie.year}</p>
                            </div>
                            <button class="btn-add-from-catalogue" onclick='addMovieFromCatalogue(${JSON.stringify(movie)})'>
                                + Add to My List
                            </button>
                        </div>
                    `).join('');
                } else {
                    emptyEl.classList.remove('hidden');
                }
            } catch (error) {
                loadingEl.classList.add('hidden');
                catalogueListEl.innerHTML = '<p style="text-align: center; color: #c33;">Error loading catalogue</p>';
            }
        }

        // Add movie from catalogue
        async function addMovieFromCatalogue(movie) {
            const errorEl = document.getElementById('addMovieError');
            const successEl = document.getElementById('addMovieSuccess');

            clearMessages();

            try {
                const response = await fetch(`${API_BASE}/movies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authToken
                    },
                    body: JSON.stringify({
                        name: movie.name,
                        genre: movie.genre,
                        year: movie.year
                    })
                });

                const data = await response.json();

                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }

                if (response.ok) {
                    successEl.textContent = `"${movie.name}" added to your list!`;
                    successEl.classList.remove('hidden');
                    loadMovies();
                    setTimeout(() => successEl.classList.add('hidden'), 3000);
                } else {
                    errorEl.textContent = data.error || 'Failed to add movie';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        }

        // Add movie
        async function addMovie() {
            const name = document.getElementById('movieName').value;
            const genre = document.getElementById('movieGenre').value;
            const year = parseInt(document.getElementById('movieYear').value);
            const errorEl = document.getElementById('addMovieError');
            const successEl = document.getElementById('addMovieSuccess');

            clearMessages();

            if (!name || !genre || !year) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/movies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authToken
                    },
                    body: JSON.stringify({ name, genre, year })
                });

                const data = await response.json();

                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }

                if (response.ok) {
                    successEl.textContent = 'Movie added successfully!';
                    successEl.classList.remove('hidden');
                    document.getElementById('movieName').value = '';
                    document.getElementById('movieGenre').value = '';
                    document.getElementById('movieYear').value = '';
                    loadMovies();
                    setTimeout(() => successEl.classList.add('hidden'), 3000);
                } else {
                    errorEl.textContent = data.error || 'Failed to add movie';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.classList.remove('hidden');
            }
        }

        // Show delete confirmation
        function showDeleteConfirm(index, name, year) {
            // Hide all other confirmation dialogs
            document.querySelectorAll('.delete-confirm').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.delete-btn').forEach(el => el.classList.remove('hidden'));
            
            // Show this one
            document.querySelector(`#movie-${index} .delete-btn`).classList.add('hidden');
            document.getElementById(`confirm-${index}`).classList.remove('hidden');
        }

        // Cancel delete
        function cancelDelete(index) {
            document.querySelector(`#movie-${index} .delete-btn`).classList.remove('hidden');
            document.getElementById(`confirm-${index}`).classList.add('hidden');
        }

        // Confirm and delete movie
        async function confirmDelete(name, year) {
            await deleteMovie(name, year);
        }

        // Delete movie
        async function deleteMovie(name, year) {
            try {
                const response = await fetch(`${API_BASE}/movies`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authToken
                    },
                    body: JSON.stringify({ name, year })
                });

                if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }

                if (response.ok) {
                    loadMovies();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to delete movie');
                }
            } catch (error) {
                alert('Connection error. Please try again.');
            }
        }

        // Initialize
        checkDatabaseStatus();
        loadAuthState();
        
        // Add enter key support for login
        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        
        document.getElementById('registerPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') register();
        });
    </script>
</body>
</html>
