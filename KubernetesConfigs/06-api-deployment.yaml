apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: default
  labels:
    app: api
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-service-container
          image: lucaslazaroiu/ccproject:api-service
          imagePullPolicy: Always
          env:
            - name: PGUSER
              value: "admin"
            - name: PGPASSWORD
              value: "admin"
            - name: PGDATATBASE
              value: "movieApp"
            - name: PGHOST
              value: "postgres"
            - name: PGHOSTADDR
              value: "10.96.152.98" # PGHOSTADDR
            - name: PGPORT
              value: "5432"
            - name: AUTH_SERVICE_URL
              value: "http://10.96.35.101:8090" # AUTH_SERVICE_URL