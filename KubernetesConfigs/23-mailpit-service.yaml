apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: default
  labels:
    app: mailpit
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: web
      protocol: TCP
      port: 8025
      targetPort: 8025
      nodePort: 30025      # Access web UI at localhost:30025
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: 1025
